<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VII — Le Septième Sceau</title>
<meta name="description" content="Pariez les âmes de vos victimes. Jeu de cartes dark fantasy, tout en points.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M3 3h2v10H3zM7 3h2v10H7zM11 3h2v10h-2z' fill='%23ece8dc'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/jacquard-24-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<main id="app">
  <section id="title" class="screen on" aria-label="VII — Le Septième Sceau"></section>

  <section id="hub" class="screen">
    <button id="to-map" class="sigil" aria-label="Prendre la route"><span>Prendre la route</span></button>
  </section>

  <section id="map" class="screen">
    <div id="nodes"></div>
    <div id="preview" class="hidden"><canvas id="pv"></canvas><b id="pv-name"></b></div>
    <button id="map-back" class="corner-btn" aria-label="Retour au chevalier">◂</button>
  </section>

  <section id="duel" class="screen">
    <div id="duel-ui">
      <div id="gauge" aria-hidden="true">
        <b id="g-target">30</b>
        <div class="col"><i id="g-foe-hand" class="hand"></i><i id="g-me-hand" class="hand"></i><span id="g-foe" class="mk foe"><b>0</b></span><span id="g-me" class="mk me"><b>0</b></span></div>
      </div>
      <div id="deck" class="pile" aria-label="L'Ossuaire"></div>
      <div id="fosse" class="pile"></div>
      <div id="cards"></div>
      <span id="v-foe" class="val foe"></span>
      <span id="v-me" class="val me"></span>
      <button id="tgt-foe" class="tgt" aria-label="Viser l'adversaire"></button>
      <button id="tgt-me" class="tgt" aria-label="Te viser toi-même"></button>
      <span id="tgt-sym"></span>
      <div id="acts">
        <button id="act-hit" class="act" title="Arracher une âme (1)"><span data-icon="grab"></span></button>
        <button id="act-stay" class="act" title="Se retirer (2)"><span data-icon="fist"></span></button>
      </div>
      <div id="banner"></div>
      <button id="pause" class="corner-btn" aria-label="Pause">❚❚</button>
      <div id="inspect" class="hidden"></div>
    </div>
  </section>

  <section id="unlock" class="screen"><div id="unlock-card"></div></section>
  <section id="death" class="screen"></section>
</main>

<div id="pause-menu" class="hidden">
  <div class="pm">
    <button data-p="resume">Reprendre</button>
    <button data-p="sound">Son : <b>actif</b></button>
    <button data-p="flee">Fuir la table</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
