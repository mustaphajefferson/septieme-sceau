<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VII — Le Septième Sceau</title>
<meta name="description" content="Douze duels de la Forêt des Pendus au trône du Roi déchu. Jeu de cartes dark fantasy à l'ancienne.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M3 3h2v10H3zM7 3h2v10H7zM11 3h2v10h-2z' fill='%23e8dcae'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/grenze-gotisch-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jacquard-24-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="veiled">
<canvas id="gl" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>

<main id="app">

  <!-- ═══ ACCUEIL : le lieu du prochain duel ═══ -->
  <section id="title" class="screen on">
    <div class="full" data-gl></div>
    <header class="t-head">
      <h1 class="logo">VII</h1>
      <p class="logo-sub">Le Septième Sceau</p>
    </header>
    <footer class="t-foot"><button id="enter" class="dbtn" disabled><span>Les âmes s'éveillent…</span></button></footer>
  </section>

  <!-- ═══ LE SEUIL : la scène, deux choix ═══ -->
  <section id="menu" class="screen">
    <div class="full" data-gl></div>
    <header class="t-head small"><h1 class="logo">VII</h1></header>
    <div class="seuil">
      <div class="next"><small id="m-zone">—</small><b id="m-foe">—</b><span id="m-tier">—</span></div>
      <div class="two">
        <button id="m-go" class="dbtn big warm"><span>Continuer</span></button>
        <button id="m-deck" class="dbtn big"><span>Deck</span></button>
      </div>
    </div>
  </section>

  <!-- ═══ TON DECK : étalé sur la table ═══ -->
  <section id="deck" class="screen">
    <div class="full" data-gl></div>
    <header class="deck-h"><h2>Ton deck</h2><p id="deck-count"></p></header>
    <p id="deck-tip" class="deck-tip"></p>
    <button class="back dbtn" data-back><span>Retour</span></button>
  </section>

  <!-- ═══ LA TABLE ═══ -->
  <section id="game" class="screen">
    <div class="full" data-gl></div>
    <div id="party"></div>
    <button id="pause" title="Pause (Échap)" aria-label="Pause"><span class="pz-ic" data-icon="hourglass"></span></button>
    <div id="banner"></div>
    <div id="say"></div>
    <div id="bar">
      <button id="b-hit" class="act hit" disabled title="Arracher une carte (1)"><span class="act-fill"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="act-ring"></span><span class="act-ic" data-icon="grab"></span><span class="act-tx"><b>Arracher</b><small>risque <u id="risk-n">0</u> %</small></span><kbd>1</kbd></button>
      <button id="b-stay" class="act stay" disabled title="Se retirer (2)"><span class="act-ring"></span><span class="act-ic" data-icon="fist"></span><span class="act-tx"><b>Se retirer</b><small>garder <u id="keep-n">0</u></small></span><kbd>2</kbd></button>
    </div>
    <div id="g-overlay" class="hidden"></div>
    <div id="pause-menu" class="page-overlay hidden">
      <div class="dpanel pausebox">
        <h2>Pause</h2>
        <p class="sub" id="pz-info"></p>
        <div id="pz-rows"></div>
        <p class="sub" id="pz-deck"></p>
        <div class="stack">
          <button class="dbtn warm" data-p="resume"><span>Reprendre</span></button>
          <button class="dbtn" data-p="sound"><span>Son : <b>actif</b></span></button>
          <button class="dbtn" data-p="flee"><span>Fuir la table</span></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ LE BUTIN (la carte gagnée s'affiche par-dessus) ═══ -->
  <section id="spoils" class="screen"></section>

  <!-- ═══ LA MORT ═══ -->
  <section id="death" class="screen">
    <div class="full" data-gl></div>
    <div class="dpanel deathbox">
      <h2>Les âmes te réclament</h2>
      <div class="dead"><img id="dt-img" alt=""></div>
      <p id="dt-lead"></p>
      <button class="dbtn warm" id="dt-go"><span>Renaître</span></button>
    </div>
  </section>
</main>
<canvas id="veil" aria-hidden="true"></canvas>
<div id="cardview" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
